<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Levercast · 4 Hybrid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* Approach 4 — Hybrid: Spread's compose-first home + Notebook's vertical editor. */
  .page { max-width: 760px; margin: 0 auto; padding: 48px 32px 120px; }
  @media (max-width: 720px) { .page { padding: 32px 20px 120px; } }

  /* Home (from Spread) */
  .home { padding-top: 88px; }
  .home h1 { font-family: var(--serif); font-weight: 300; font-size: 44px; line-height: 1.15; letter-spacing: -0.015em; margin: 0 0 28px; }
  .home .idea-field { min-height: 180px; font-size: 21px; }
  .recent { margin-top: 72px; }
  .recent-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { display: grid; gap: 10px; padding: 18px 20px; border: 1px solid var(--hairline); border-radius: var(--r-lg); text-decoration: none; color: var(--ink); transition: background var(--ease); }
  .card:hover { background: var(--paper); }
  .card .idea { font-family: var(--serif); font-size: 17px; line-height: 1.45; }
  .card .meta { display: flex; gap: 8px; align-items: center; }
  .all .cards { grid-template-columns: 1fr; }
  .all h1 { font-family: var(--serif); font-weight: 400; font-size: 36px; margin: 8px 0 24px; }
  @media (max-width: 720px) { .home { padding-top: 40px; } .home h1 { font-size: 32px; } .cards { grid-template-columns: 1fr; } }

  /* Editor (from Notebook) */
  .strip { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,0.96); border-bottom: 1px solid var(--hairline); }
  .strip-inner { max-width: 760px; margin: 0 auto; padding: 10px 32px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  @media (max-width: 720px) { .strip-inner { padding: 8px 20px; } }
  .strip .back { margin-left: -10px; }
  .strip .spacer { flex: 1; }
  .jump { display: inline-flex; align-items: center; gap: 8px; }
  .jump .lbl { color: var(--slate); font-weight: 400; font-size: 12px; }
  @media (max-width: 720px) { .jump .lbl { display: none; } }
  .drafts { margin-top: 56px; display: grid; gap: 48px; }
  .draft-section { scroll-margin-top: 72px; }
  .draft-head { display: flex; align-items: baseline; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); margin-bottom: 16px; }
  .draft-head h2 { font-family: var(--serif); font-weight: 500; font-size: 24px; margin: 0; }
  .draft-head .spacer { flex: 1; }
  .draft-head .state { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--slate); }
  .foot { margin-top: 72px; padding-top: 20px; border-top: 1px solid var(--hairline); display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>
<header class="topbar">
  <a class="wordmark" href="#/">Levercast</a>
  <span class="spacer"></span>
  <a class="btn btn-ghost" href="#/all">My posts</a>
  <button class="btn btn-ghost">Sign out</button>
</header>
<div id="strip"></div>
<main id="app" class="page"></main>

<script src="shared.js"></script>
<script>
const app = document.getElementById("app");
const strip = document.getElementById("strip");
let currentId = null;
const current = () => (currentId ? LC.getPost(currentId) : null);

function route() {
  const h = location.hash || "#/";
  const m = h.match(/^#\/post\/(.+)$/);
  return m ? { name: "post", id: m[1] } : h === "#/all" ? { name: "all" } : { name: "home" };
}
const card = (p) => `<a class="card" href="#/post/${p.id}"><span class="idea">${LC.esc(LC.preview(p.idea, 110))}</span>
  <span class="meta">${LC.statusPill(p)}<span class="caption">Updated ${LC.relTime(p.updatedAt)}</span></span></a>`;

function renderHome() {
  currentId = null;
  strip.innerHTML = "";
  const posts = LC.posts();
  app.innerHTML = `<div class="home">
    <h1>What's been on your mind this week?</h1>
    ${LC.ideaBlock(null, { label: "", placeholder: "Type it rough. It doesn't need to be good.", rows: 6, autofocus: true })}
    ${posts.length ? `<section class="recent" aria-labelledby="recent-h">
      <div class="recent-head"><span class="eyebrow" id="recent-h">Recent</span><a href="#/all" class="caption">All posts →</a></div>
      <div class="cards">${posts.slice(0, 4).map(card).join("")}</div></section>` : ""}
  </div>`;
  LC.bindIdea(app, {
    getPost: current,
    onCreate: (p) => { currentId = p.id; },
    onGenerate: (p) => { currentId = p.id; history.pushState(null, "", "#/post/" + p.id); renderEditor(); window.scrollTo(0, 0); },
  });
}

function renderAll() {
  strip.innerHTML = "";
  const posts = LC.posts();
  app.innerHTML = `<div class="all"><a class="btn btn-ghost" style="margin-left:-10px" href="#/">← New post</a><h1>My posts</h1>
    ${posts.length ? `<div class="cards">${posts.map(card).join("")}</div>`
      : `<p class="draft-empty">Nothing here yet. <a href="#/">Start with a rough idea.</a></p>`}</div>`;
}

function renderEditor() {
  const post = current();
  strip.innerHTML = `<nav class="strip" aria-label="Post"><div class="strip-inner">
    <a class="btn btn-ghost back" href="#/all">← My posts</a><span class="spacer"></span>
    ${LC.PLATFORMS.map((p) => `<button class="btn btn-ghost btn-sm jump" data-jump="${p.id}">
      <span class="dot dot-${LC.draftState(post, p.id)}" data-dot="${p.id}" data-post="${post.id}"></span>${p.name}
      <span class="lbl" data-state-label="${p.id}" data-post="${post.id}">${LC.STATE_LABEL[LC.draftState(post, p.id)]}</span></button>`).join("")}
  </div></nav>`;
  app.innerHTML = `
    ${LC.ideaBlock(post)}
    <div class="drafts">${LC.PLATFORMS.map((p) => `
      <section class="draft-section" id="d-${p.id}" aria-labelledby="h-${p.id}">
        <div class="draft-head"><h2 id="h-${p.id}">${p.name}</h2>
          <span class="caption">${p.id === "x" ? "2–6 tweets, 280 each" : `up to ${p.limit.toLocaleString()} characters`}</span>
          <span class="spacer"></span>
          <span class="state"><span class="dot dot-${LC.draftState(post, p.id)}" data-dot="${p.id}" data-post="${post.id}"></span>
          <span data-state-label="${p.id}" data-post="${post.id}">${LC.STATE_LABEL[LC.draftState(post, p.id)]}</span></span>
        </div>
        <div data-panel-body="${p.id}" data-post="${post.id}" aria-live="polite">${LC.panelBody(post, p.id)}</div>
      </section>`).join("")}</div>
    <div class="foot"><span class="caption">Created ${LC.relTime(post.createdAt)}</span>
      <button class="btn btn-ghost btn-danger" data-delete>Delete post</button></div>`;
  LC.autosize(app);
  LC.bindIdea(app, { getPost: current, onGenerate: () => renderEditor() });
  app.querySelector("[data-delete]").addEventListener("click", () =>
    LC.confirmDelete(() => { LC.deletePost(post.id); location.hash = "#/all"; }));
}

function render() {
  LC.cancelAll();
  const r = route();
  if (r.name === "post") {
    currentId = r.id;
    if (!current()) { strip.innerHTML = ""; app.innerHTML = `<h1>Not found</h1><p>This post doesn't exist or was deleted. <a href="#/all">Back to My posts</a></p>`; return; }
    renderEditor();
  } else if (r.name === "all") { currentId = null; renderAll(); }
  else renderHome();
  window.scrollTo(0, 0);
}

LC.bindPanels(app, current);
strip.addEventListener("click", (e) => {
  const b = e.target.closest("[data-jump]");
  if (b) document.getElementById("d-" + b.dataset.jump)?.scrollIntoView({ behavior: "smooth" });
});
LC.hooks.reset = () => { location.hash = "#/"; render(); };
window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
LC.protoControls("hybrid");
render();
</script>
</body>
</html>
